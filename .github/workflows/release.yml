name: Build & Publish GitHub Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Release VaultGuard 360
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore packages
        run: dotnet restore .\VaultGuard360.csproj

      - name: Build application
        run: dotnet build .\VaultGuard360.csproj -c Release --no-restore

      - name: Run PowerShell safety tests
        shell: pwsh
        run: |
          if (Test-Path ".\Tests\Hardening-Tests.ps1") {
            .\Tests\Hardening-Tests.ps1
          }

      - name: Build custom installer
        shell: pwsh
        run: .\Build-Installer.ps1

      - name: Verify release assets
        shell: pwsh
        run: |
          if (-not (Test-Path ".\VaultGuard360_Setup.exe")) { throw "VaultGuard360_Setup.exe was not produced." }
          if (-not (Test-Path ".\bin\Publish\VaultGuard360.exe")) { throw "VaultGuard360.exe was not produced." }
          Copy-Item ".\bin\Publish\VaultGuard360.exe" ".\VaultGuard360.exe" -Force

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: VaultGuard 360 ${{ github.ref_name }}
          body: |
            ## VaultGuard 360
            Klyvex Studios Windows malware defense and recovery suite.

            This build includes the native WPF application, in-process PowerShell detection engine,
            baseline recovery vault, quarantine controls, removable-media protection, and installer.
          draft: false
          prerelease: false
          files: |
            VaultGuard360_Setup.exe
            VaultGuard360.exe
            icon.ico
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
